name: tests
on:
  push:
  pull_request:

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: ruff check fier scripts/fetch_sshx.py scripts/fier-volume runtime/fier-sshx tests
      - run: bash -n install.sh
      - run: python -m compileall -q fier scripts/fetch_sshx.py
